name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/build-android.yml"
  pull_request:
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK for Android build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build installable debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Name the APK for download
        run: cp app/build/outputs/apk/debug/app-debug.apk streaming-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: streaming-debug-apk
          path: streaming-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Streaming APK ${{ github.run_number }}
          files: streaming-debug.apk
          generate_release_notes: true
          make_latest: true
          draft: false
          prerelease: false
          body: |
            Debug APK for tablet install.

            Install `streaming-debug.apk`, tap the Streaming icon to configure
            the SMP, then point Fully Kiosk Browser at `http://127.0.0.1:8080/`.
