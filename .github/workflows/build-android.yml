name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "*.go"
      - "go.mod"
      - "go.sum"
      - "internal/**"
      - "scripts/**"
      - "app/**"
      - "web/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/build-android.yml"
  pull_request:
    paths:
      - "*.go"
      - "go.mod"
      - "go.sum"
      - "internal/**"
      - "scripts/**"
      - "app/**"
      - "web/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK for Android build
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Test Go controller
        run: go test ./...

      # Every build has to carry the same signature or Android will not
      # install it over the copy already on the tablet, and an uninstall
      # costs the tablet its saved configuration.
      - name: Decode the signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret is set, so this APK gets a throwaway key and will not install over an existing copy."
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.p12
          echo "Decoded $(wc -c < release.p12) bytes of keystore."
          # Naming the keys it holds turns a wrong password or an unexpected
          # alias into a failure here, with an explanation, rather than into a
          # bare signing error several minutes later.
          if ! keytool -list -keystore release.p12 -storetype PKCS12 \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" > keystore-listing.txt 2>&1; then
            echo "::error::Could not open the keystore. Check that ANDROID_KEYSTORE_PASSWORD matches the password used to export it."
            exit 1
          fi
          awk -F, '/PrivateKeyEntry/ { print "signing key alias: " $1 }' keystore-listing.txt
          rm -f keystore-listing.txt

      - name: Build installable debug APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          APK_VERSION_CODE: ${{ github.run_number }}
          APK_VERSION_NAME: 1.0.${{ github.run_number }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Report how the APK was signed
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk \
            | grep -i 'certificate DN\|SHA-256 digest' || true

      - name: Name the APK for download
        run: cp app/build/outputs/apk/debug/app-debug.apk streaming-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: streaming-debug-apk
          path: streaming-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: apk-${{ github.run_number }}
          name: Streaming APK ${{ github.run_number }}
          files: streaming-debug.apk
          generate_release_notes: true
          make_latest: true
          draft: false
          prerelease: false
          body: |
            Debug APK for tablet install.

            Install `streaming-debug.apk`, tap the Streaming icon to configure
            the SMP, then point Fully Kiosk Browser at `http://127.0.0.1:8080/`.
