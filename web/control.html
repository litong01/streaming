<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Streaming</title>
  <style>
    /*
      Same visual language as the myconsole launcher theme that Fully Kiosk
      injects, so the streaming page looks like one more launcher screen.
    */
    :root {
      color-scheme: dark;
      --bg: #0b0b0c;
      --bg-soft: #141416;
      --text: #e8eaed;
      --text-dim: rgba(232, 234, 237, 0.72);
      --ring: rgba(255, 255, 255, 0.09);
      --ring-hover: rgba(255, 255, 255, 0.16);
      --glow: rgba(138, 180, 248, 0.18);
      --accent: #8ab4f8;
      --warn: #f28b82;
      --live: #81c995;
      --tile: 132px;
      --gap: 28px;
      --icon-inset: 18px;
      --label-size: 1.05rem;
      --font: "Google Sans", Roboto, system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      text-align: center;
      background:
        radial-gradient(1200px 700px at 50% 38%, #1a1d24 0%, transparent 62%),
        radial-gradient(900px 500px at 50% 100%, rgba(138, 180, 248, 0.06) 0%, transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    #header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 2;
      padding: 28px 24px 0;
      pointer-events: none;
    }

    .clock {
      font-size: clamp(2.4rem, 6vw, 3.4rem);
      font-weight: 300;
      letter-spacing: -0.03em;
      line-height: 1;
    }

    .date {
      margin-top: 8px;
      font-size: clamp(0.95rem, 2.2vw, 1.1rem);
      color: var(--text-dim);
    }

    #stage {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 88px 24px 72px;
    }

    /*
      The outline, not the picture, is what says whether a stream is going
      out: the camera is black whenever the room's source is off, so a live
      stream and a stopped one look identical inside the frame. Red is the
      resting state and green means the SMP is really publishing.
    */
    .preview {
      width: min(420px, 72vw);
      aspect-ratio: 16 / 9;
      border-radius: 18px;
      overflow: hidden;
      border: 3px solid var(--warn);
      background: #000;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
      transition: border-color 200ms ease, box-shadow 200ms ease;
    }

    .preview.live {
      border-color: var(--live);
      box-shadow:
        0 18px 40px rgba(0, 0, 0, 0.35),
        0 0 26px rgba(129, 201, 149, 0.35);
    }

    .preview[hidden] {
      display: none;
    }

    .preview video {
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
      object-fit: cover;
    }

    .preview-row {
      display: flex;
      align-items: stretch;
      justify-content: center;
      gap: 18px;
    }

    .audio-panel {
      width: 232px;
      min-height: 236px;
      padding: 12px 14px;
      border: 1px solid var(--ring);
      border-radius: 18px;
      background: rgba(20, 20, 22, 0.94);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
    }

    .audio-title {
      margin-bottom: 8px;
      color: var(--text-dim);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .clip-warning {
      min-height: 24px;
      margin-bottom: 6px;
      padding: 4px 8px;
      border: 1px solid transparent;
      border-radius: 5px;
      color: transparent;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .clip-warning.active {
      border-color: #ff8a80;
      background: #b3261e;
      color: #fff;
      box-shadow: 0 0 12px rgba(242, 139, 130, 0.5);
    }

    .audio-channels {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .audio-channel {
      display: grid;
      grid-template-columns: 26px 34px 12px;
      grid-template-rows: auto 122px auto;
      gap: 4px 6px;
      justify-content: center;
    }

    .channel-label {
      grid-column: 1 / 4;
      font-size: 0.75rem;
      color: var(--text-dim);
    }

    /*
      The scale is drawn against the handle's travel rather than the whole
      slot, since a range input keeps half a thumb of margin at either end.
    */
    .scale {
      --thumb: 16px;
      position: relative;
      width: 26px;
      height: 122px;
      font-size: 0.56rem;
      font-variant-numeric: tabular-nums;
      color: rgba(232, 234, 237, 0.5);
    }

    .tick {
      position: absolute;
      right: 0;
      top: calc(var(--thumb) / 2 + (100% - var(--thumb)) * var(--at));
      display: flex;
      align-items: center;
      gap: 3px;
      transform: translateY(-50%);
      white-space: nowrap;
    }

    .tick::after {
      content: "";
      width: 6px;
      height: 1px;
      background: rgba(255, 255, 255, 0.3);
    }

    .tick.minor::after { width: 3px; }

    .fader-slot {
      position: relative;
      width: 34px;
      height: 122px;
    }

    .gain-fader {
      position: absolute;
      top: 51px;
      left: -44px;
      width: 122px;
      accent-color: var(--accent);
      transform: rotate(-90deg);
      cursor: pointer;
    }

    .meter {
      position: relative;
      width: 12px;
      height: 122px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 3px;
      background: #080909;
    }

    .meter-fill {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 0;
      background: linear-gradient(to top, #34a853 0 72%, #fbbc04 72% 96%, #ea4335 96%);
      transition: height 100ms linear;
    }

    .meter-clip {
      position: absolute;
      top: 0;
      right: 0;
      left: 0;
      height: 5px;
      background: #53120e;
      transition: background 100ms linear, box-shadow 100ms linear;
    }

    .meter-clip.active {
      background: #ff3b30;
      box-shadow: 0 0 8px #ff3b30;
    }

    .gain-value {
      grid-column: 1 / 4;
      font-variant-numeric: tabular-nums;
      font-size: 0.72rem;
      color: var(--text-dim);
    }

    .audio-buttons {
      display: grid;
      grid-template-columns: 42px 1fr 42px;
      gap: 7px;
      margin-top: 9px;
    }

    .audio-button {
      min-height: 34px;
      border: 1px solid var(--ring-hover);
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      font: inherit;
      font-size: 0.86rem;
      cursor: pointer;
    }

    .audio-button:active { transform: scale(0.96); }

    .audio-button.muted {
      border-color: rgba(242, 139, 130, 0.65);
      background: rgba(242, 139, 130, 0.18);
      color: var(--warn);
    }

    .audio-panel.unavailable {
      opacity: 0.42;
    }

    .audio-panel.unavailable .audio-button,
    .audio-panel.unavailable .gain-fader {
      cursor: not-allowed;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(3, var(--tile));
      gap: var(--gap);
      justify-content: center;
    }

    /* Round icon well with the label underneath, as on the launcher */
    .tile {
      width: var(--tile);
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--text-dim);
      font-family: inherit;
      cursor: pointer;
      transition: transform 180ms ease;
    }

    .tile:active { transform: scale(0.96); }

    .icon {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: var(--tile);
      height: var(--tile);
      padding: var(--icon-inset);
      border-radius: 50%;
      border: 1px solid var(--ring);
      background:
        radial-gradient(circle at 35% 28%, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02) 55%, rgba(0, 0, 0, 0.15) 100%),
        var(--bg-soft);
      box-shadow:
        0 18px 40px rgba(0, 0, 0, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      transition: border-color 180ms ease, box-shadow 180ms ease;
    }

    .tile:hover .icon {
      border-color: var(--ring-hover);
      box-shadow:
        0 22px 48px rgba(0, 0, 0, 0.42),
        0 0 0 1px var(--glow),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .art {
      width: 100%;
      height: 100%;
      fill: none;
      stroke: var(--text);
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .glyph {
      fill: var(--text);
      stroke: none;
      font-family: var(--font);
      font-size: 9px;
      font-weight: 500;
      text-anchor: middle;
    }

    .label {
      display: block;
      max-width: calc(var(--tile) + 8px);
      margin: 4px auto 0;
      padding: 0 4px;
      font-size: var(--label-size);
      line-height: 1.25;
      letter-spacing: 0.01em;
      overflow-wrap: break-word;
    }

    /* The running stream reads as a lit tile with a live dot */
    .tile.active { color: var(--text); }

    .tile.active .icon {
      border-color: rgba(138, 180, 248, 0.55);
      box-shadow:
        0 22px 48px rgba(0, 0, 0, 0.42),
        0 0 0 1px rgba(138, 180, 248, 0.35),
        0 0 28px rgba(138, 180, 248, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .tile.active .icon::after {
      content: "";
      position: absolute;
      top: 22px;
      right: 22px;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px rgba(138, 180, 248, 0.85);
      animation: live 2s ease-in-out infinite;
    }

    @keyframes live {
      50% { opacity: 0.35; }
    }

    .tile:disabled {
      cursor: not-allowed;
      opacity: 0.32;
    }

    .tile:disabled:active { transform: none; }

    #stop .stop-mark { fill: var(--warn); stroke: none; }

    .readout {
      max-width: 30rem;
      display: grid;
      gap: 6px;
    }

    .status {
      font-size: clamp(1rem, 2.4vw, 1.2rem);
      color: var(--text-dim);
    }

    .status.offline { color: var(--warn); }

    .error {
      font-size: 0.85rem;
      line-height: 1.35;
      color: rgba(242, 139, 130, 0.85);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 1.15rem;
    }

    #footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 0 24px 22px;
    }

    #footer a {
      color: rgba(232, 234, 237, 0.45);
      font-size: 0.9rem;
      text-decoration: none;
    }

    @media (orientation: portrait) {
      :root {
        --tile: 118px;
        --gap: 22px;
        --icon-inset: 16px;
      }
    }

    @media (max-width: 640px) {
      :root {
        --tile: 104px;
        --gap: 18px;
        --icon-inset: 14px;
        --label-size: 0.95rem;
      }

      .preview-row {
        align-items: center;
        flex-direction: column;
      }

      .audio-panel {
        width: min(420px, 92vw);
      }

      .audio-channel {
        grid-template-rows: auto 82px auto;
      }

      .fader-slot,
      .meter,
      .scale {
        height: 82px;
      }

      .gain-fader {
        top: 31px;
        left: -24px;
        width: 82px;
      }
    }
  </style>
</head>
<body>
  <div id="header">
    <div id="clock" class="clock">--:--</div>
    <div id="date" class="date"></div>
  </div>

  <main id="stage">
    <div class="preview-row">
      <div id="preview" class="preview" hidden>
        <video id="previewVideo" title="Live camera preview" autoplay muted playsinline></video>
      </div>

      <section id="audioPanel" class="audio-panel unavailable" aria-label="Stream audio">
        <div class="audio-title">Stream Audio · HDMI 2</div>
        <div id="clipWarning" class="clip-warning" role="status">LEVEL TOO HIGH</div>
        <div class="audio-channels">
          <div class="audio-channel">
            <label class="channel-label" for="leftGain">Left</label>
            <div class="scale" aria-hidden="true">
              <span class="tick" style="--at: 0">+24</span>
              <span class="tick minor" style="--at: 0.1429"></span>
              <span class="tick" style="--at: 0.2857">+12</span>
              <span class="tick minor" style="--at: 0.4286"></span>
              <span class="tick" style="--at: 0.5714">0</span>
              <span class="tick minor" style="--at: 0.7143"></span>
              <span class="tick minor" style="--at: 0.8571"></span>
              <span class="tick" style="--at: 1">-18</span>
            </div>
            <div class="fader-slot">
              <input id="leftGain" class="gain-fader" type="range"
                     min="-180" max="240" step="1" disabled aria-label="Left gain">
            </div>
            <div class="meter" aria-label="Left audio level">
              <div id="leftMeter" class="meter-fill"></div>
              <div id="leftClip" class="meter-clip"></div>
            </div>
            <output id="leftGainValue" class="gain-value" for="leftGain">-- dB</output>
          </div>
          <div class="audio-channel">
            <label class="channel-label" for="rightGain">Right</label>
            <div class="scale" aria-hidden="true">
              <span class="tick" style="--at: 0">+24</span>
              <span class="tick minor" style="--at: 0.1429"></span>
              <span class="tick" style="--at: 0.2857">+12</span>
              <span class="tick minor" style="--at: 0.4286"></span>
              <span class="tick" style="--at: 0.5714">0</span>
              <span class="tick minor" style="--at: 0.7143"></span>
              <span class="tick minor" style="--at: 0.8571"></span>
              <span class="tick" style="--at: 1">-18</span>
            </div>
            <div class="fader-slot">
              <input id="rightGain" class="gain-fader" type="range"
                     min="-180" max="240" step="1" disabled aria-label="Right gain">
            </div>
            <div class="meter" aria-label="Right audio level">
              <div id="rightMeter" class="meter-fill"></div>
              <div id="rightClip" class="meter-clip"></div>
            </div>
            <output id="rightGainValue" class="gain-value" for="rightGain">-- dB</output>
          </div>
        </div>
        <div class="audio-buttons">
          <button id="gainDown" class="audio-button" type="button" disabled
                  aria-label="Lower stream audio one decibel">−</button>
          <button id="audioMute" class="audio-button" type="button" disabled>Mute</button>
          <button id="gainUp" class="audio-button" type="button" disabled
                  aria-label="Raise stream audio one decibel">+</button>
        </div>
      </section>
    </div>

    <div id="grid" role="group" aria-label="Streaming controls">
      <button id="english" class="tile" type="button">
        <span class="icon">
          <svg class="art" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="2.5" y="4.5" width="19" height="12" rx="2.5"/>
            <path d="M7.5 16.5v3.4l4.3-3.4"/>
            <text class="glyph" x="12" y="13.4">A</text>
          </svg>
        </span>
        <span class="label">Start English</span>
      </button>

      <button id="mandarin" class="tile" type="button">
        <span class="icon">
          <svg class="art" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="2.5" y="4.5" width="19" height="12" rx="2.5"/>
            <path d="M7.5 16.5v3.4l4.3-3.4"/>
            <text class="glyph" x="12" y="13.6">文</text>
          </svg>
        </span>
        <span class="label">Start Mandarin</span>
      </button>

      <button id="stop" class="tile" type="button" disabled>
        <span class="icon">
          <svg class="art" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="8.6"/>
            <rect class="stop-mark" x="9.1" y="9.1" width="5.8" height="5.8" rx="1.2"/>
          </svg>
        </span>
        <span class="label">Stop</span>
      </button>
    </div>

    <div class="readout" aria-live="polite">
      <div id="statusValue" class="status">Loading...</div>
      <div id="statusError" class="error"></div>
    </div>
  </main>

  <div id="footer">
    <a href="/config">Configuration</a>
  </div>

  <script>
    const clock = document.getElementById("clock");
    const date = document.getElementById("date");
    const statusValue = document.getElementById("statusValue");
    const statusError = document.getElementById("statusError");
    const englishButton = document.getElementById("english");
    const mandarinButton = document.getElementById("mandarin");
    const stopButton = document.getElementById("stop");
    const preview = document.getElementById("preview");
    const previewVideo = document.getElementById("previewVideo");
    const audioPanel = document.getElementById("audioPanel");
    const clipWarning = document.getElementById("clipWarning");
    const leftGain = document.getElementById("leftGain");
    const rightGain = document.getElementById("rightGain");
    const leftGainValue = document.getElementById("leftGainValue");
    const rightGainValue = document.getElementById("rightGainValue");
    const leftMeter = document.getElementById("leftMeter");
    const rightMeter = document.getElementById("rightMeter");
    const leftClip = document.getElementById("leftClip");
    const rightClip = document.getElementById("rightClip");
    const gainDown = document.getElementById("gainDown");
    const gainUp = document.getElementById("gainUp");
    const audioMute = document.getElementById("audioMute");
    let busy = false;
    let previewPlaying = false;
    let audioBusy = false;
    let audioEditing = false;
    let audioAvailable = false;
    let currentGainTenths = 0;
    let currentMuted = false;

    function pad(value) {
      return value < 10 ? "0" + value : String(value);
    }

    function updateClock() {
      const now = new Date();
      clock.textContent = pad(now.getHours()) + ":" + pad(now.getMinutes());
      date.textContent = now.toLocaleDateString(undefined, {
        weekday: "long",
        month: "long",
        day: "numeric"
      });
    }

    function applyState(data) {
      const reachable = Boolean(data.smpReachable);
      statusValue.textContent = data.statusMessage || "Idle";
      statusValue.classList.toggle("offline", !reachable);
      statusError.textContent = data.lastError || "";
      englishButton.classList.toggle("active", data.activeStream === "english");
      mandarinButton.classList.toggle("active", data.activeStream === "mandarin");
      englishButton.disabled = busy || !reachable;
      mandarinButton.disabled = busy || !reachable;
      stopButton.disabled = busy || !reachable || !data.streaming;
      updatePreview(data);
    }

    // The SMP serves its own preview whether or not an encoder is streaming,
    // so the picture is shown whenever the unit is reachable rather than only
    // while a language is live.
    function updatePreview(data) {
      preview.classList.toggle("live", Boolean(data.streaming));
      if (!data.previewAvailable) {
        stopPreview();
        preview.hidden = true;
        return;
      }
      preview.hidden = false;
      if (!previewPlaying) {
        startPreview();
      }
    }

    function startPreview() {
      previewPlaying = true;
      previewVideo.src = "/api/preview?t=" + Date.now();
      const started = previewVideo.play();
      if (started) {
        started.catch(function () {});
      }
    }

    function stopPreview() {
      if (!previewPlaying) {
        return;
      }
      previewPlaying = false;
      previewVideo.removeAttribute("src");
      previewVideo.load();
    }

    function restartPreview() {
      if (!previewPlaying) {
        return;
      }
      stopPreview();
      setTimeout(function () {
        if (!preview.hidden) {
          startPreview();
        }
      }, 3000);
    }

    function formatDB(tenths) {
      const value = tenths / 10;
      return (value > 0 ? "+" : "") + value.toFixed(1) + " dB";
    }

    function meterPercent(tenths) {
      // The SMP meter bottoms out around -90 dB and clips at 0 dB.
      return Math.max(0, Math.min(100, ((tenths + 900) / 900) * 100));
    }

    function enableAudioControls(enabled) {
      const usable = enabled && !audioBusy;
      leftGain.disabled = !usable;
      rightGain.disabled = !usable;
      gainDown.disabled = !usable;
      gainUp.disabled = !usable;
      audioMute.disabled = !usable;
    }

    function applyAudioState(data) {
      audioAvailable = true;
      audioPanel.classList.remove("unavailable");
      currentGainTenths = Math.round(
        (Number(data.leftGainTenths) + Number(data.rightGainTenths)) / 2
      );
      currentMuted = Boolean(data.muted);

      if (!audioEditing) {
        leftGain.value = data.leftGainTenths;
        rightGain.value = data.rightGainTenths;
        leftGainValue.textContent = formatDB(data.leftGainTenths);
        rightGainValue.textContent = formatDB(data.rightGainTenths);
      }

      const leftLevel = Number(data.leftLevelTenths);
      const rightLevel = Number(data.rightLevelTenths);
      leftMeter.style.height = meterPercent(leftLevel) + "%";
      rightMeter.style.height = meterPercent(rightLevel) + "%";
      leftClip.classList.toggle("active", leftLevel >= -30);
      rightClip.classList.toggle("active", rightLevel >= -30);
      clipWarning.classList.toggle("active", Boolean(data.clipping));

      audioMute.textContent = currentMuted ? "Unmute" : "Mute";
      audioMute.classList.toggle("muted", currentMuted);
      audioMute.setAttribute("aria-pressed", String(currentMuted));
      enableAudioControls(true);
    }

    function showAudioUnavailable() {
      audioAvailable = false;
      audioPanel.classList.add("unavailable");
      enableAudioControls(false);
      leftMeter.style.height = "0";
      rightMeter.style.height = "0";
      leftClip.classList.remove("active");
      rightClip.classList.remove("active");
      clipWarning.classList.remove("active");
    }

    async function refreshAudio() {
      if (audioBusy || audioEditing) return;
      try {
        const response = await fetch("/api/audio", { cache: "no-store" });
        if (response.status === 204) return;
        applyAudioState(await readJson(response));
      } catch (error) {
        showAudioUnavailable();
      }
    }

    function previewGangedGain(value) {
      const gain = Math.max(-180, Math.min(240, Math.round(Number(value))));
      leftGain.value = gain;
      rightGain.value = gain;
      leftGainValue.textContent = formatDB(gain);
      rightGainValue.textContent = formatDB(gain);
      currentGainTenths = gain;
      return gain;
    }

    async function setAudioGain(gainTenths) {
      if (!audioAvailable || audioBusy) return;
      const gain = previewGangedGain(gainTenths);
      audioBusy = true;
      enableAudioControls(false);
      try {
        const response = await fetch("/api/audio/gain", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ gainTenths: gain })
        });
        if (response.status !== 204) {
          applyAudioState(await readJson(response));
        }
      } catch (error) {
        statusError.textContent = "Audio adjustment failed: " + error;
      } finally {
        audioBusy = false;
        audioEditing = false;
        enableAudioControls(audioAvailable);
        await refreshAudio();
      }
    }

    async function setAudioMute(muted) {
      if (!audioAvailable || audioBusy) return;
      audioBusy = true;
      enableAudioControls(false);
      try {
        const response = await fetch("/api/audio/mute", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ muted: muted })
        });
        if (response.status !== 204) {
          applyAudioState(await readJson(response));
        }
      } catch (error) {
        statusError.textContent = "Audio mute failed: " + error;
      } finally {
        audioBusy = false;
        enableAudioControls(audioAvailable);
        await refreshAudio();
      }
    }

    previewVideo.addEventListener("error", restartPreview);
    previewVideo.addEventListener("ended", restartPreview);

    function showOffline(message, error) {
      statusValue.textContent = message;
      statusValue.classList.add("offline");
      statusError.textContent = String(error);
      englishButton.classList.remove("active");
      mandarinButton.classList.remove("active");
      englishButton.disabled = true;
      mandarinButton.disabled = true;
      stopButton.disabled = true;
      showAudioUnavailable();
      updatePreview({});
    }

    async function readJson(response) {
      const data = await response.json();
      if (!response.ok) {
        throw new Error(data.error || "Request failed");
      }
      return data;
    }

    async function refreshStatus() {
      try {
        const response = await fetch("/api/status", { cache: "no-store" });
        applyState(await readJson(response));
      } catch (error) {
        showOffline("Server unavailable", error);
      }
    }

    async function postAction(path) {
      if (busy) return;
      busy = true;
      englishButton.disabled = true;
      mandarinButton.disabled = true;
      stopButton.disabled = true;
      statusValue.textContent = "Working...";
      statusValue.classList.remove("offline");
      try {
        const response = await fetch(path, { method: "POST" });
        applyState(await readJson(response));
      } catch (error) {
        showOffline("SMP is not reachable", error);
      } finally {
        busy = false;
        await refreshStatus();
      }
    }

    englishButton.addEventListener("click", () => postAction("/api/stream/english"));
    mandarinButton.addEventListener("click", () => postAction("/api/stream/mandarin"));
    stopButton.addEventListener("click", () => postAction("/api/stream/stop"));
    [leftGain, rightGain].forEach(function (fader) {
      fader.addEventListener("input", function () {
        audioEditing = true;
        previewGangedGain(fader.value);
      });
      fader.addEventListener("change", function () {
        setAudioGain(fader.value);
      });
    });
    gainDown.addEventListener("click", () => setAudioGain(currentGainTenths - 10));
    gainUp.addEventListener("click", () => setAudioGain(currentGainTenths + 10));
    audioMute.addEventListener("click", () => setAudioMute(!currentMuted));

    updateClock();
    setInterval(updateClock, 10000);
    refreshStatus();
    setInterval(refreshStatus, 3000);
    refreshAudio();
    setInterval(refreshAudio, 500);
  </script>
</body>
</html>
