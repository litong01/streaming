<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Configuration</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0b0c;
      --text: #e8eaed;
      --muted: rgba(232, 234, 237, 0.72);
      --accent: #8ab4f8;
      --ring: rgba(255, 255, 255, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(1200px 700px at 50% 0%, #1a1d24 0%, transparent 62%),
        var(--bg);
      color: var(--text);
      font-family: "Google Sans", Roboto, system-ui, -apple-system, sans-serif;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .panel { width: min(860px, 100%); margin: 0 auto; }
    h1 { font-size: 32px; font-weight: 300; letter-spacing: -0.02em; margin: 0 0 8px; }
    h2 { font-size: 20px; font-weight: 400; margin: 36px 0 8px; }
    .hint { color: var(--muted); margin: 0 0 28px; line-height: 1.5; }
    nav { display: grid; gap: 12px; }
    a {
      display: flex;
      align-items: center;
      min-height: 64px;
      padding: 0 22px;
      border-radius: 999px;
      border: 1px solid var(--ring);
      color: var(--accent);
      text-decoration: none;
      font-size: 18px;
    }
    #logView {
      margin: 0;
      max-height: 420px;
      overflow: auto;
      padding: 16px;
      border-radius: 16px;
      border: 1px solid var(--ring);
      background: rgba(0, 0, 0, 0.35);
      color: var(--text);
      font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Configuration</h1>
    <p class="hint">Choose which settings to change.</p>
    <nav>
      <a href="/config/streaming">Streaming</a>
      <a href="/config/av">AV system control</a>
    </nav>
    <section class="log">
      <h2>Log</h2>
      <pre id="logView">Loading…</pre>
    </section>
  </main>
  <script>
    const logView = document.getElementById("logView");

    async function refreshLog() {
      const nearBottom = logView.scrollHeight - logView.scrollTop - logView.clientHeight < 24;
      try {
        const response = await fetch("/api/logs");
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Could not load the log");
        const lines = data.lines || [];
        logView.textContent = lines.length ? lines.join("\n") : "No log lines yet.";
      } catch (error) {
        logView.textContent = String(error.message || error);
      }
      if (nearBottom) logView.scrollTop = logView.scrollHeight;
    }

    refreshLog();
    setInterval(refreshLog, 2000);
  </script>
</body>
</html>
